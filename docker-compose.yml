version: '3.8'

services:
  # Reverse proxy Nginx qui gère 80/443 et les vhosts dynamiquement
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: cinephoria_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./docker/proxy/certs:/etc/nginx/certs:rw
      - ./docker/proxy/vhost.d:/etc/nginx/vhost.d
      - ./docker/proxy/html:/usr/share/nginx/html
    restart: unless-stopped

  # Compagnon Let's Encrypt (ACME) qui émet/renouvelle les certificats
  acme:
    image: nginxproxy/acme-companion
    container_name: cinephoria_acme
    environment:
      NGINX_PROXY_CONTAINER: cinephoria_nginx_proxy
      # Optionnel : force la redirection HTTP -> HTTPS et HSTS
      # DEFAULT_EMAIL utilisé pour les certs si un service n'a pas LETSENCRYPT_EMAIL
      DEFAULT_EMAIL: "contact@cinephoria.cloud"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/proxy/certs:/etc/nginx/certs:rw
      - ./docker/proxy/vhost.d:/etc/nginx/vhost.d
      - ./docker/proxy/html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  # Ton Nginx d'application (sert le code PHP via php-fpm)
  web:
    image: nginx:alpine
    container_name: cinephoria_web
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/logs:/var/log/nginx
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: "cinephoria.cloud,www.cinephoria.cloud"
      LETSENCRYPT_HOST: "cinephoria.cloud,www.cinephoria.cloud"
      LETSENCRYPT_EMAIL: "contact@cinephoria.cloud"   # mets ton email
    depends_on:
      - php
    restart: unless-stopped

  # Ton PHP-FPM tel quel
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cinephalia_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: cinephalia_db
    environment:
      POSTGRES_DB: cinephalia
      POSTGRES_USER: cinephaliadoctrine
      POSTGRES_PASSWORD: ggy9nwhNrsLUt6N
    volumes:
      - postgres_data:/var/lib/postgresql/data

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> doctrine/mongodb-odm-bundle ###
  mongodb:
    # In production, you may want to use a managed database service
    image: mongodb/mongodb-atlas-local:latest
    environment:
      - MONGODB_INITDB_DATABASE=${MONGODB_DB:-app}
      # You should definitely set a root username and password in production
      - MONGODB_INITDB_ROOT_USERNAME=${MONGODB_USERNAME:-}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/mongodb/data:/data/db:rw
###< doctrine/mongodb-odm-bundle ###

volumes:
  postgres_data:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> doctrine/mongodb-odm-bundle ###
  mongodb_data:
###< doctrine/mongodb-odm-bundle ###
